name: iOS Build Ad-Hoc (Manuell)

on:
  workflow_dispatch:

jobs:
  build:
    # 1. Wechsel von macos-14 auf macos-15 für Xcode 26+ Support
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Xcode-Version explizit auf Xcode 26 (oder neuer) setzen
      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0' # Entspricht dem geforderten iOS 26 SDK

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary_password"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp $PP_PATH "$HOME/Library/MobileDevice/Provisioning Profiles/"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Update Xcode Configuration Files
        run: |
          echo "PROVISIONING_PROFILE_SPECIFIER = ${{ env.PROFILE_UUID }}" >> ios/Flutter/Debug.xcconfig
          echo "DEVELOPMENT_TEAM = 5236CM6C65" >> ios/Flutter/Debug.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER = ${{ env.PROFILE_UUID }}" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM = 5236CM6C65" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = Apple Distribution" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution" >> ios/Flutter/Release.xcconfig

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-name=1.0.0 \
            --build-number=5 # Version muss für jeden iOS Build hochgezählt werden

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ad-hoc
          path: build/ios/ipa/*.ipa

      - name: Logoutput
        run: ls -alR build/ios/ipa/*

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ios/ipa/DataMaggi01.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          # Sagt Apple, dass die App keine spezielle Verschlüsselung nutzt:
          uses-non-exempt-encryption: false
          # Die Action beendet sich sofort nach dem Upload, ohne auf Apples Verarbeitung zu warten:
          wait-for-processing: false
